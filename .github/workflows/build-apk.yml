name: Build Ludo Yaari Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Prepare and sign Android project
        run: node scripts/prepare-android.mjs

      - name: Assemble release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Collect APK and store icons
        run: cp android/app/build/outputs/apk/release/*.apk release-artifacts/LudoYaari-Release.apk

      - name: Upload release APK and store icons
        uses: actions/upload-artifact@v4
        with:
          name: LudoYaari-Release-APK
          path: release-artifacts/
          if-no-files-found: error

