name: Build CrazyGames Single HTML

on:
  push:
    branches:
      - crazygames
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun add -d vite-plugin-singlefile
      - run: bun run build
      - name: Upload Single HTML
        uses: actions/upload-artifact@v4
        with:
          name: ludo-yaari-single-html
          path: dist/index.html
          
