name: Build CrazyGames ZIP

on:
  push:
    branches:
      - crazygames
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Create ZIP file
        run: |
          cd dist
          zip -r ../ludo-yaari-crazygames.zip .
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ludo-yaari-crazygames
          path: ludo-yaari-crazygames.zip
