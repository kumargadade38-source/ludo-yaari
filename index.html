<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ludo Yaari</title>
    <meta name="description" content="Play 3D Ludo online with friends or smart bots directly in your browser." />
    <script>
      (function () {
        var s = document.createElement('script');
        s.src = ['https://integration', 'gamepix', 'com/sdk/v3/gamepix', 'sdk', 'js'].join('.');
        s.onload = function () {
          if (window.GamePix && typeof window.GamePix.loaded === 'function') {
            window.GamePix.loaded();
          }
        };
        document.head.appendChild(s);
      })();
    </script>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0f0913] text-white antialiased selection:bg-amber-300 selection:text-stone-950 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setInterval(() => {
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.includes('AdMob Banner Space')) {
              const box = node.parentElement;
              if (box) box.style.display = 'none';
              break;
            }
          }
        }, 500);
      });
    </script>
  </body>
</html>
